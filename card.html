<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Health Card</title>
  <script src="assets/route.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #eef2f7; --ink: #0f172a; --muted: #64748b; --panel: #ffffff; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --ink: #e2e8f0; --muted: #94a3b8; --panel: #111827; --line: #1f2937; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: radial-gradient(120% 70% at 50% 0%, rgba(13,148,136,.18), transparent 60%), var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
    .stage { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
    .hint { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn { height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 14px Inter, sans-serif; cursor: pointer; }
    .btn.primary { background: #0f766e; border-color: #0f766e; color: #fff; }
    .note { max-width: 380px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .err { text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 28px 24px; border-radius: 18px; max-width: 360px; }
    .err h1 { font-size: 18px; margin: 0 0 6px; }
    .err p { margin: 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main class="stage" id="stage"></main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="assets/patient-card.js"></script>
  <script>
    (() => {
      const d = PatientCard.decode(location.hash), stage = document.getElementById('stage');
      if (!d || !d.n) {
        stage.innerHTML = '<div class="err"><h1>Card not found</h1><p>This link is incomplete. Scan the QR on the back of the health card again.</p></div>';
        return;
      }
      document.title = d.n + ' · Health Card';
      stage.innerHTML = PatientCard.html(d, { link: location.href, width: 'min(100%, 400px)' }) +
        '<p class="hint">Tap the card to flip it</p>' +
        '<div class="actions"><button class="btn primary" id="share">Share</button><button class="btn" id="print">Print</button></div>' +
        '<p class="note">This card holds only basic, non-clinical details. Records, reports and bills stay in the hospital’s patient portal.</p>';
      document.getElementById('print').onclick = () => window.print();
      document.getElementById('share').onclick = async () => {
        try { if (navigator.share) return await navigator.share({ title: document.title, url: location.href }); await navigator.clipboard.writeText(location.href); document.getElementById('share').textContent = 'Link copied'; }
        catch (e) {}
      };
    })();
  </script>
</body>
</html>
