<!doctype html>
<html lang="en">
<head>
  <script src="assets/route.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verify sign-in — HMS Cloud</title>
  <script>
    try {
      const t = localStorage.getItem('hms-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="assets/app.css" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">

<div class="mx-auto flex min-h-screen w-full max-w-md flex-col px-4 pb-6 pt-4">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-teal-500 to-cyan-700 text-white shadow-sm"><i data-lucide="heart-pulse" class="h-5 w-5"></i></div>
      <div class="leading-tight"><p class="text-[15px] font-bold tracking-tight text-slate-900 dark:text-white">HMS Cloud</p><p class="text-[11px] text-slate-500">Sign-in verification</p></div>
    </div>
    <button data-action="theme" class="grid h-9 w-9 place-items-center rounded-lg border border-slate-200 bg-white text-slate-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300"></button>
  </header>

  <main id="view" class="flex flex-1 flex-col justify-center py-6" aria-live="polite"></main>

  <p class="flex items-center justify-center gap-1.5 text-center text-[11px] text-slate-400"><i data-lucide="lock" class="h-3 w-3"></i>Secure link · single use · expires in 2 minutes</p>
</div>

<div id="toasts" class="pointer-events-none fixed inset-x-4 top-4 z-[90] mx-auto flex max-w-sm flex-col gap-2"></div>

<script src="assets/auth.js"></script>
<script>
(() => {
  const { $, icons, esc } = Auth;
  const view = $('#view');
  const p = new URLSearchParams(location.search);
  const session = p.get('s'), user = Auth.userById(p.get('u')), exp = Number(p.get('exp')), from = p.get('d') || 'Unknown browser';
  const primary = 'inline-flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-teal-600 px-4 text-[15px] font-semibold text-white shadow-sm transition hover:bg-teal-700 focus:outline-none focus:ring-4 focus:ring-teal-500/25 disabled:opacity-60';
  const link = 'font-medium text-teal-700 hover:underline disabled:cursor-not-allowed disabled:text-slate-400 disabled:no-underline dark:text-teal-400 dark:disabled:text-slate-600';
  let otp = null, tries = 0;

  const card = (html) => `<div class="step-in rounded-3xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">${html}</div>`;
  const endState = (icon, tone, title, text) => {
    view.innerHTML = card(`<div class="py-4 text-center">
      <span class="mx-auto grid h-16 w-16 place-items-center rounded-full ${tone}">${icon === 'check' ? '<svg class="check-draw h-8 w-8" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : `<i data-lucide="${icon}" class="h-7 w-7"></i>`}</span>
      <h1 class="mt-5 text-xl font-bold tracking-tight text-slate-900 dark:text-white">${title}</h1>
      <p class="mx-auto mt-2 max-w-xs text-sm text-slate-500 dark:text-slate-400">${text}</p></div>`);
    icons();
  };

  if (!session || !user || !exp) return endState('link-2-off', 'bg-slate-100 text-slate-500 dark:bg-slate-800', 'Link not valid', 'Scan the QR code on your computer’s sign-in screen again.');
  if (Date.now() > exp) return endState('timer-off', 'bg-amber-50 text-amber-600 dark:bg-amber-500/15', 'This code has expired', 'Tap “Get new code” on your computer and scan again.');

  Auth.post(session, 'scanned');

  const time = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  view.innerHTML = card(`
    <div class="flex items-center gap-3">
      <span class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-amber-50 text-amber-600 dark:bg-amber-500/15 dark:text-amber-300"><i data-lucide="shield-check" class="h-5 w-5"></i></span>
      <div><h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Is this you signing in?</h1><p class="text-xs text-slate-500">Admin account · Sun Hospital</p></div>
    </div>
    <dl class="mt-5 divide-y divide-slate-100 rounded-2xl border border-slate-200 text-sm dark:divide-slate-800 dark:border-slate-800">
      <div class="flex items-center justify-between gap-3 px-3.5 py-2.5"><dt class="text-slate-500">Account</dt><dd class="truncate font-medium text-slate-800 dark:text-slate-200">${esc(user.name)}</dd></div>
      <div class="flex items-center justify-between gap-3 px-3.5 py-2.5"><dt class="text-slate-500">Device</dt><dd class="truncate font-medium text-slate-800 dark:text-slate-200">${esc(from)}</dd></div>
      <div class="flex items-center justify-between gap-3 px-3.5 py-2.5"><dt class="text-slate-500">Near</dt><dd class="truncate font-medium text-slate-800 dark:text-slate-200">Bardhaman, IN</dd></div>
      <div class="flex items-center justify-between gap-3 px-3.5 py-2.5"><dt class="text-slate-500">Time</dt><dd class="font-medium text-slate-800 dark:text-slate-200">Today, ${time}</dd></div>
    </dl>

    <form id="f" class="mt-6" novalidate>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Enter the code sent to <span class="whitespace-nowrap">${Auth.maskPhone(user.phone)}</span></label>
      <div id="boxes" class="mt-2.5"></div>
      <p id="err" class="mt-3 hidden items-start gap-2 rounded-xl bg-rose-50 px-3 py-2.5 text-sm text-rose-700 dark:bg-rose-500/10 dark:text-rose-300"></p>
      <button id="vBtn" class="${primary} mt-4">Verify &amp; sign in</button>
    </form>
    <div class="mt-4 flex items-center justify-between text-sm">
      <span class="text-slate-500">Didn’t get the SMS?</span><button id="resend" class="${link}">Resend code</button>
    </div>
    <button id="deny" class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl border border-rose-200 px-4 py-2.5 text-sm font-semibold text-rose-600 transition hover:bg-rose-50 dark:border-rose-500/30 dark:text-rose-400 dark:hover:bg-rose-500/10"><i data-lucide="ban" class="h-4 w-4"></i>This wasn’t me</button>
  `);
  icons();

  const err = (m) => { const e = $('#err'); if (!m) return e.classList.add('hidden'); e.innerHTML = `<i data-lucide="circle-alert" class="mt-0.5 h-4 w-4 shrink-0"></i><span>${m}</span>`; e.classList.remove('hidden'); e.classList.add('flex'); icons(); };
  const boxes = Auth.otpBoxes($('#boxes'), () => $('#f').requestSubmit());
  const send = () => { otp = Auth.genOtp(); tries = 0; Auth.demoOtpToast(otp, 'SMS'); Auth.cooldown($('#resend'), 30); };
  send(); setTimeout(() => boxes.focus(), 300);

  $('#resend').onclick = () => { send(); boxes.clear(); err(); Auth.toast('New code sent', 'Use the latest SMS — older codes stop working.', 'teal', 'send'); };
  $('#deny').onclick = () => {
    Auth.post(session, 'denied');
    endState('shield-alert', 'bg-rose-50 text-rose-600 dark:bg-rose-500/15', 'Sign-in blocked', 'We stopped this attempt and alerted your security log. Consider changing your password.');
  };
  $('#f').onsubmit = (e) => {
    e.preventDefault(); err();
    if (Date.now() > exp) return endState('timer-off', 'bg-amber-50 text-amber-600 dark:bg-amber-500/15', 'This code has expired', 'Get a new QR code on your computer and scan again.');
    const v = boxes.value();
    if (v.length < 6) { boxes.error(); return err('Enter all 6 digits.'); }
    if (!otp) { boxes.error(); return err('Too many wrong codes. Tap “Resend code”.'); }
    if (v === otp) {
      Auth.post(session, 'verified');
      return endState('check', 'bg-teal-50 text-teal-600 dark:bg-teal-500/15 dark:text-teal-400', 'You’re verified', 'Go back to your computer — it will sign you in automatically. You can close this page.');
    }
    tries++; boxes.error(); boxes.clear();
    if (tries >= 5) { otp = null; return err('Too many wrong codes. Tap “Resend code”.'); }
    err(`Wrong code. ${5 - tries} attempt${5 - tries === 1 ? '' : 's'} left.`);
  };

  Auth.initTheme();
})();
</script>
</body>
</html>
